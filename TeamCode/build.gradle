apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Git setup for this clone, runs on every Gradle sync/build so nobody has to do it by hand
// (see docs/git.md): our hooks (commit message check), and pulls that rebase instead of merge.
[['core.hooksPath', '.githooks'], ['pull.rebase', 'true'], ['rebase.autoStash', 'true']].each { key, value ->
    try {
        providers.exec {
            workingDir rootDir
            commandLine 'git', 'config', key, value
            ignoreExitValue = true
        }.result.get()
    } catch (Exception ignored) {
        // git not installed / not on PATH, never fail the build over this
    }
}

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply plugin: 'dev.frozenmilk.sinister.sloth.load'
buildscript {
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://repo.dairy.foundation/releases"
        }
    }
    dependencies {
        classpath "dev.frozenmilk:Load:0.3.2"    // was 0.2.4
    }
}
android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')
}

// Saves the robot's hardware config XML(s) into /configs every time you build/deploy (Run in Android Studio
// builds first). Best effort: no robot connected over adb = silently skipped, never fails the build.
tasks.register('saveRobotConfig') {
    doLast {
        try {
            def props = new Properties()
            def lp = new File(rootDir, 'local.properties')
            if (lp.exists()) lp.withInputStream { props.load(it) }
            def sdk = props.getProperty('sdk.dir')
            def adb = (sdk && new File(sdk, 'platform-tools/adb').exists()) ? new File(sdk, 'platform-tools/adb').path : 'adb'

            def run = { List<String> cmd ->
                def r = providers.exec {
                    commandLine cmd
                    ignoreExitValue = true
                }
                r.standardOutput.asText.get().trim()
            }

            def files = run([adb, 'shell', 'ls', '/sdcard/FIRST/*.xml']).readLines()
                    .collect { it.trim() }.findAll { it.endsWith('.xml') }
            if (files.isEmpty()) {
                println 'saveRobotConfig: no robot connected / no config XML found, skipped'
                return
            }
            def dest = new File(rootDir, 'configs')
            dest.mkdirs()
            files.each { f ->
                run([adb, 'pull', f, new File(dest, f.tokenize('/').last()).path])
                println "saveRobotConfig: saved ${f.tokenize('/').last()} to configs/"
            }
        } catch (Exception e) {
            println "saveRobotConfig: skipped (${e.cause ?: e.message})"
        }
    }
}

afterEvaluate {
    tasks.matching { it.name == 'assembleDebug' || it.name == 'assembleRelease' }.configureEach {
        finalizedBy 'saveRobotConfig'
    }
}
